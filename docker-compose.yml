services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: webfoto
      MYSQL_USER: webfoto
      MYSQL_PASSWORD: webfoto
      MYSQL_ROOT_PASSWORD: change-this-root-password
    volumes:
      - ./database:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uwebfoto -pwebfoto --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: ./app
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./data:/data
    expose:
      - "3000"
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
